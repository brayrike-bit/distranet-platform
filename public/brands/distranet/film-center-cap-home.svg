<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Distranet branded hydraulic center cap">
  <defs>
    <radialGradient id="plate" cx="42%" cy="34%" r="74%">
      <stop offset="0" stop-color="#2d3035"/><stop offset="0.55" stop-color="#15171a"/><stop offset="0.84" stop-color="#090a0c"/><stop offset="1" stop-color="#020203"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#73777e"/><stop offset="0.18" stop-color="#1f2227"/><stop offset="0.64" stop-color="#050608"/><stop offset="1" stop-color="#4d1114"/>
